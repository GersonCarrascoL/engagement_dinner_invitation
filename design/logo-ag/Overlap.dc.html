<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,700&family=Pinyon+Script&display=swap">
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; }
  </style>
</helmet>

<div style="width:480px; height:480px; display:flex; align-items:center; justify-content:center; background:transparent;">
  <div style="position:relative; width:320px; height:220px;">
    <span style="position:absolute; left:0; top:0; font-family:'Playfair Display', serif; font-weight:700; font-size:200px; color:#1a1a1a; line-height:1;">G</span>
    <span style="position:absolute; right:0; bottom:6px; font-family:'Pinyon Script', cursive; font-size:170px; color:{{accent}}; line-height:1;">A</span>
  </div>
</div>
</x-dc>
<script data-dc-script data-props='{"accent":{"editor":"color","default":"#6b2b2b"}}'>
class Component extends DCLogic {
  renderVals() {
    return { accent: this.props.accent ?? '#6b2b2b' };
  }
}
</script>
</body>
</html>
