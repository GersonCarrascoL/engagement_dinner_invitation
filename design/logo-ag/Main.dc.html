<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,700;1,400&family=Pinyon+Script&display=swap">
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; }
  </style>
</helmet>

<div style="width:480px; height:480px; display:flex; align-items:center; justify-content:center; background:transparent;">
  <div style="display:flex; align-items:baseline; gap:14px; font-family:'Playfair Display', Georgia, serif; font-weight:700; font-size:110px; color:#1a1a1a; letter-spacing:0.01em;">
    <span>G</span>
    <span style="font-family:'Playfair Display', serif; font-weight:400; font-style:italic; font-size:62px; color:{{accent}};">&amp;</span>
    <span>A</span>
  </div>
</div>
</x-dc>
<script data-dc-script data-props='{"accent":{"editor":"color","default":"#6b2b2b"}}'>
class Component extends DCLogic {
  renderVals() {
    return { accent: this.props.accent ?? '#6b2b2b' };
  }
}
</script>
</body>
</html>
