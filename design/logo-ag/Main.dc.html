<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,700;1,400&family=Pinyon+Script&display=swap">
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; }
  </style>
</helmet>

<div style="width:480px; height:480px; display:flex; align-items:center; justify-content:center; background:transparent;">
  <div style="width:360px; height:360px; border-radius:50%; border:2px solid #1a1a1a; display:flex; align-items:center; justify-content:center; position:relative;">
    <div style="position:absolute; inset:14px; border-radius:50%; border:1px solid #1a1a1a;"></div>
    <div style="display:flex; align-items:baseline; gap:12px; font-family:'Playfair Display', Georgia, serif; font-weight:700; font-size:92px; color:#1a1a1a; letter-spacing:0.01em;">
      <span>A</span>
      <span style="font-family:'Pinyon Script', cursive; font-size:58px; color:{{accent}};">&amp;</span>
      <span>G</span>
    </div>
  </div>
</div>
</x-dc>
<script data-dc-script data-props='{"accent":{"editor":"color","default":"#6b2b2b"}}'>
class Component extends DCLogic {
  renderVals() {
    return { accent: this.props.accent ?? '#6b2b2b' };
  }
}
</script>
</body>
</html>
