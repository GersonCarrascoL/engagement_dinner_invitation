<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500&display=swap">
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; }
  </style>
</helmet>

<div style="width:480px; height:480px; display:flex; align-items:center; justify-content:center; background:transparent;">
  <div style="display:flex; flex-direction:column; align-items:center; gap:16px;">
    <div style="display:flex; align-items:center; gap:22px; font-family:'Cinzel', serif; font-weight:500; font-size:88px; color:#1a1a1a; letter-spacing:0.03em;">
      <span>G</span>
      <span style="width:8px; height:8px; border-radius:50%; background:{{accent}}; align-self:center;"></span>
      <span>A</span>
    </div>
    <div style="width:180px; border-top:1px solid #1a1a1a;"></div>
  </div>
</div>
</x-dc>
<script data-dc-script data-props='{"accent":{"editor":"color","default":"#6b2b2b"}}'>
class Component extends DCLogic {
  renderVals() {
    return { accent: this.props.accent ?? '#6b2b2b' };
  }
}
</script>
</body>
</html>
