<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Monsieur+La+Doulaise&family=Cormorant+Garamond:ital@1&display=swap">
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; }
  </style>
</helmet>

<div style="width:480px; height:480px; display:flex; align-items:center; justify-content:center; background:transparent;">
  <div style="display:flex; align-items:baseline; font-family:'Monsieur La Doulaise', cursive; font-size:190px; color:#1a1a1a; line-height:1;">
    <span>G</span>
    <span style="font-family:'Cormorant Garamond', serif; font-style:italic; font-weight:400; font-size:56px; color:{{accent}}; margin:0 6px; align-self:center;">&amp;</span>
    <span>A</span>
  </div>
</div>
</x-dc>
<script data-dc-script data-props='{"accent":{"editor":"color","default":"#6b2b2b"}}'>
class Component extends DCLogic {
  renderVals() {
    return { accent: this.props.accent ?? '#6b2b2b' };
  }
}
</script>
</body>
</html>
